name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore native desktop application
        run: dotnet restore src/SteaMidra.Desktop/SteaMidra.Desktop.csproj
      - name: Publish Linux desktop application
        run: dotnet publish src/SteaMidra.Desktop/SteaMidra.Desktop.csproj -c Release -r linux-x64 --self-contained true --no-restore -o dist/SteaMidra_GUI
      - name: Create Linux portable archive
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props)
          test -n "$VERSION"
          tar -C dist -czf "SteaMidra-${VERSION}-linux-x64.tar.gz" SteaMidra_GUI
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: SteaMidra-*-linux-x64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Bundle latest LumaCore release
        shell: pwsh
        run: |
          $headers = @{ Accept = 'application/vnd.github+json'; 'User-Agent' = 'SteaMidra-release-build' }
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/KoriaPolis/LumaCore/releases/latest' -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -eq 'Release.zip' } | Select-Object -First 1
          if (-not $asset) { $asset = $release.assets | Where-Object { $_.name -like '*.zip' } | Select-Object -First 1 }
          if (-not $asset) { throw 'The latest LumaCore release does not contain a ZIP asset.' }

          $archive = Join-Path $env:RUNNER_TEMP 'LumaCore.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'LumaCore'
          $destination = 'src\SteaMidra.Desktop\lumacore'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive -Headers $headers
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          foreach ($name in 'dwmapi.dll', 'xinput1_4.dll', 'LumaCore.dll', 'LumaCorePayload.dll') {
            $file = Get-ChildItem -Path $extract -Recurse -File | Where-Object { $_.Name -ieq $name } | Select-Object -First 1
            if (-not $file) { throw "The LumaCore archive is missing $name." }
            Copy-Item -Path $file.FullName -Destination (Join-Path $destination $name) -Force
          }
      - name: Install NSIS
        uses: negrutiu/nsis-install@v2
      - name: Build installer
        shell: cmd
        run: call build_installer.bat
      - name: Verify native application output
        shell: pwsh
        run: |
          $exe = Get-Item 'dist\SteaMidra_GUI\SteaMidra_GUI.exe' -ErrorAction Stop
          if ($exe.Length -lt 100KB) { throw 'Published desktop executable is unexpectedly small.' }
          if (Get-ChildItem -Path dist\SteaMidra_GUI -Recurse -Filter python*.dll) { throw 'Python runtime leaked into the native desktop package.' }
          foreach ($name in 'dwmapi.dll', 'xinput1_4.dll', 'LumaCore.dll', 'LumaCorePayload.dll') {
            if (-not (Test-Path "dist\SteaMidra_GUI\lumacore\$name")) { throw "Bundled LumaCore file is missing from the Windows package: $name" }
          }
      - name: Create portable Windows zip
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          Compress-Archive -Force -Path 'dist\SteaMidra_GUI' -DestinationPath "SteaMidra-$version-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            SteaMidra-*-windows.zip
            SteaMidra-*-Setup.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-release/SteaMidra-*-linux-x64.tar.gz
            windows-release/SteaMidra-*-windows.zip
            windows-release/SteaMidra-*-Setup.exe
          draft: false
          prerelease: false
          body_path: release-note.md
