name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore native desktop application
        run: dotnet restore src/SteaMidra.Desktop/SteaMidra.Desktop.csproj
      - name: Publish Linux desktop application
        run: dotnet publish src/SteaMidra.Desktop/SteaMidra.Desktop.csproj -c Release -r linux-x64 --self-contained true --no-restore -o dist/SteaMidra_GUI
      - name: Create Linux portable archive
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props)
          test -n "$VERSION"
          tar -C dist -czf "SteaMidra-${VERSION}-linux-x64.tar.gz" SteaMidra_GUI
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: SteaMidra-*-linux-x64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install NSIS
        uses: negrutiu/nsis-install@v2
      - name: Build installer
        shell: cmd
        run: call build_installer.bat
      - name: Verify native application output
        shell: pwsh
        run: |
          $exe = Get-Item 'dist\SteaMidra_GUI\SteaMidra_GUI.exe' -ErrorAction Stop
          if ($exe.Length -lt 100KB) { throw 'Published desktop executable is unexpectedly small.' }
          if (Get-ChildItem -Path dist\SteaMidra_GUI -Recurse -Filter python*.dll) { throw 'Python runtime leaked into the native desktop package.' }
      - name: Create portable Windows zip
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          Compress-Archive -Force -Path 'dist\SteaMidra_GUI' -DestinationPath "SteaMidra-$version-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            SteaMidra-*-windows.zip
            SteaMidra-*-Setup.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-release/SteaMidra-*-linux-x64.tar.gz
            windows-release/SteaMidra-*-windows.zip
            windows-release/SteaMidra-*-Setup.exe
          draft: false
          prerelease: false
          body_path: release-note.md
